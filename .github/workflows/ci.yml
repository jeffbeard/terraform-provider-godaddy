# Runs build, vet, and unit tests on every pull request and on pushes to master.
# Integration tests (build tag "integration") need live GoDaddy credentials and
# are compiled here but never run.
name: ci
on:
  pull_request:
  push:
    branches:
      - master
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
      - name: Check go.mod is tidy
        run: go mod tidy -diff
      - name: Build
        run: go build ./...
      - name: Vet
        run: |
          go vet ./...
          go vet -tags integration ./api
      - name: Test
        run: go test -race -count=1 ./...
  release-config:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
      - name: Snapshot build of all release targets
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: '~> v2'
          args: release --snapshot --clean --skip=sign
